spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/flea_market
    username: flea_market
    password: flea_market
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

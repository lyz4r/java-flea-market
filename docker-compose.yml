services:
  postgres:
    image: postgres:15-alpine
    container_name: flea-market-postgres
    environment:
      POSTGRES_DB: flea_market
      POSTGRES_USER: flea_market
      POSTGRES_PASSWORD: flea_market
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flea_market -d flea_market" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
